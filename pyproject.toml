[project]
name = "twitter-auto"
version = "0.1.0"
description = "Curate Reddit AI x Crypto signals into Chinese X/Twitter draft ideas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
twitter-auto = "twitter_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
